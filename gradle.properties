# AndroidX — OBLIGATOIRE
android.useAndroidX=true
android.enableJetifier=false

# Kotlin
kotlin.code.style=official

# JVM Gradle — augmenté pour éviter OOM sur gros projets
org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

# Kotlin compiler daemon
kotlin.daemon.jvm.options=-Xmx4g -XX:MaxMetaspaceSize=512m

# Build options
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true

# R8
android.enableR8.fullMode=false
android.nonTransitiveRClass=true
